name: Deploy Backend

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'package.json'
      - 'Dockerfile'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'stg'
        type: choice
        options:
          - stg
          - prod
      run_migrations:
        description: 'Run Prisma migrations'
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/reservaya-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  run-migrations:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ github.event.inputs.run_migrations != 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event.inputs.environment }}" != "" ]; then
            echo "env=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "env=prod" >> $GITHUB_OUTPUT
          else
            echo "env=stg" >> $GITHUB_OUTPUT
          fi

      - name: Run Prisma Migrations
        env:
          DATABASE_URL: ${{ steps.env.outputs.env == 'prod' && secrets.DATABASE_URL_PROD || secrets.DATABASE_URL_STG }}
        run: |
          echo "Running migrations for ${{ steps.env.outputs.env }} environment..."
          npx prisma migrate deploy

      - name: Generate Prisma Client
        env:
          DATABASE_URL: ${{ steps.env.outputs.env == 'prod' && secrets.DATABASE_URL_PROD || secrets.DATABASE_URL_STG }}
        run: npx prisma generate

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push, run-migrations]
    if: always() && needs.build-and-push.result == 'success'

    steps:
      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event.inputs.environment }}" != "" ]; then
            echo "env=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "env=prod" >> $GITHUB_OUTPUT
          else
            echo "env=stg" >> $GITHUB_OUTPUT
          fi

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        run: |
          az webapp config container set \
            --name reservaya-backend-${{ steps.env.outputs.env }} \
            --resource-group rsgreservaya${{ steps.env.outputs.env }} \
            --docker-custom-image-name ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

          az webapp restart \
            --name reservaya-backend-${{ steps.env.outputs.env }} \
            --resource-group rsgreservaya${{ steps.env.outputs.env }}

      - name: Wait for deployment
        run: sleep 30

      - name: Health check
        run: |
          BACKEND_URL="https://reservaya-backend-${{ steps.env.outputs.env }}.azurewebsites.net/health"
          echo "Checking health at $BACKEND_URL"

          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" $BACKEND_URL || echo "000")
            if [ "$STATUS" == "200" ]; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i: Status $STATUS, waiting..."
            sleep 10
          done

          echo "Health check failed after 5 attempts"
          exit 1

      - name: Deployment Summary
        run: |
          echo "## Backend Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ steps.env.outputs.env }}" >> $GITHUB_STEP_SUMMARY
          echo "- Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "- URL: https://reservaya-backend-${{ steps.env.outputs.env }}.azurewebsites.net" >> $GITHUB_STEP_SUMMARY
